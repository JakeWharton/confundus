[versions]
kotlin = "2.4.21"

[libraries]
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }

# HEY! If you update the minimum-supported Gradle version check to see if the Kotlin language version or
# Java targets can be bumped. See https://docs.gradle.org/current/userguide/compatibility.html.
gradle-minimum = "org.gradle.experimental:gradle-public-api:9.8.1"

kotlinCompilerTester = "dev.zacsweers.kctfork:core:0.14.0"

buildConfigPlugin = "com.github.gmazzo.buildconfig:plugin:6.1.2"
gradleMavenPublishPlugin = "com.vanniktech:gradle-maven-publish-plugin:0.37.0"
dokkaPlugin = "org.jetbrains.dokka:dokka-gradle-plugin:2.2.0"
compatPlugin = "com.gradleup.tapmoc:tapmoc-gradle-plugin:0.4.2"

junit = "junit:junit:4.13.2"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
testParameterInjector = "com.google.testparameterinjector:test-parameter-injector:1.24"
asm-util = "org.ow2.asm:asm-util:9.11"
